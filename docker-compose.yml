# Local WordPress + WooCommerce for OrcaRail gateway real-flow tests.
# Does not join the root orcarail-net — API/pay run on the host.
name: orcarail-woo

services:
  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - woo_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'healthcheck.sh',
          '--connect',
          '--innodb_initialized',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  wordpress:
    image: wordpress:6.7-php8.2-apache
    ports:
      - '${WORDPRESS_PORT:-8088}:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
    volumes:
      - woo_wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/orcarail-woocommerce
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'php -r "exit(@file_get_contents(\"http://127.0.0.1/\") === false ? 1 : 0);"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  wpcli:
    image: wordpress:cli-php8.2
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
    volumes:
      - woo_wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/orcarail-woocommerce
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy

volumes:
  woo_db_data:
  woo_wp_data:
